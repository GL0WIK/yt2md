<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#17392a"/>
      <stop offset="1" stop-color="#2c6a4b"/>
    </linearGradient>
    <linearGradient id="wave" x1="0" x2="1">
      <stop offset="0" stop-color="#a8d5b5" stop-opacity="0"/>
      <stop offset=".5" stop-color="#a8d5b5"/>
      <stop offset="1" stop-color="#a8d5b5" stop-opacity="0"/>
    </linearGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.3" fill="#ffffff" opacity=".07"/>
    </pattern>
  </defs>
  <rect width="1280" height="400" rx="24" fill="url(#bg)"/>
  <rect width="1280" height="400" rx="24" fill="url(#dots)"/>

  <!-- Logo -->
  <rect x="80" y="92" width="96" height="96" rx="22" fill="#ffffff"/>
  <text x="128" y="157" text-anchor="middle" font-size="44" font-weight="800" fill="#23563d" letter-spacing="-1">YT</text>

  <text x="80" y="268" font-size="76" font-weight="800" fill="#ffffff" letter-spacing="-2">YT-RAG Local</text>
  <text x="82" y="318" font-size="27" fill="#cfe5d6">Une chaîne YouTube → un corpus texte pour votre IA.</text>
  <text x="82" y="356" font-size="21" fill="#8fbf9f">100 % local · Qwen3-ASR · Qwen3.5-9B · GPU NVIDIA</text>

  <!-- Video → text illustration -->
  <g transform="translate(760 70)">
    <!-- Video card -->
    <rect x="0" y="20" width="200" height="128" rx="16" fill="#ffffff" opacity=".12"/>
    <rect x="12" y="32" width="176" height="104" rx="10" fill="#0f2a1e" opacity=".55"/>
    <path d="M86 62 L120 84 L86 106 Z" fill="#ffffff"/>
    <rect x="12" y="148" width="176" height="6" rx="3" fill="#ffffff" opacity=".15"/>
    <rect x="12" y="148" width="104" height="6" rx="3" fill="#7fd09a"/>

    <!-- Waveform -->
    <g fill="#a8d5b5">
      <rect x="10" y="200" width="6" height="18" rx="3"/>
      <rect x="22" y="192" width="6" height="34" rx="3"/>
      <rect x="34" y="184" width="6" height="50" rx="3"/>
      <rect x="46" y="196" width="6" height="26" rx="3"/>
      <rect x="58" y="188" width="6" height="42" rx="3"/>
      <rect x="70" y="200" width="6" height="18" rx="3"/>
      <rect x="82" y="180" width="6" height="58" rx="3"/>
      <rect x="94" y="192" width="6" height="34" rx="3"/>
      <rect x="106" y="198" width="6" height="22" rx="3"/>
      <rect x="118" y="186" width="6" height="46" rx="3"/>
      <rect x="130" y="194" width="6" height="30" rx="3"/>
      <rect x="142" y="202" width="6" height="14" rx="3"/>
      <rect x="154" y="190" width="6" height="38" rx="3"/>
      <rect x="166" y="198" width="6" height="22" rx="3"/>
      <rect x="178" y="203" width="6" height="12" rx="3"/>
    </g>

    <!-- Arrow -->
    <path d="M222 140 H272" stroke="#7fd09a" stroke-width="5" stroke-linecap="round"/>
    <path d="M262 128 L276 140 L262 152" fill="none" stroke="#7fd09a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Document -->
    <rect x="296" y="10" width="172" height="250" rx="16" fill="#ffffff"/>
    <text x="316" y="46" font-family="Consolas, Menlo, monospace" font-size="15" font-weight="700" fill="#23563d"># 00:42</text>
    <rect x="316" y="60" width="132" height="8" rx="4" fill="#d5e3d8"/>
    <rect x="316" y="76" width="112" height="8" rx="4" fill="#d5e3d8"/>
    <rect x="316" y="92" width="124" height="8" rx="4" fill="#d5e3d8"/>
    <text x="316" y="130" font-family="Consolas, Menlo, monospace" font-size="15" font-weight="700" fill="#23563d"># 00:49</text>
    <rect x="316" y="144" width="96" height="8" rx="4" fill="#d5e3d8"/>
    <rect x="316" y="160" width="132" height="8" rx="4" fill="#d5e3d8"/>
    <rect x="316" y="186" width="132" height="54" rx="8" fill="#e8f0e3"/>
    <text x="328" y="210" font-size="13" font-weight="700" fill="#23563d">à l’écran</text>
    <rect x="328" y="220" width="96" height="7" rx="3.5" fill="#b9d2c0"/>
  </g>
</svg>
