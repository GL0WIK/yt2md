<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#4f8064"/>
    </marker>
    <style>
      .box { fill: #ffffff; stroke: #cfdccf; stroke-width: 1.5; }
      .gpu { fill: #e8f0e3; stroke: #4f8064; stroke-width: 1.5; }
      .t { font-size: 17px; font-weight: 700; fill: #22302c; }
      .s { font-size: 13px; fill: #5b675f; }
      .tag { font-size: 11px; font-weight: 700; fill: #23563d; letter-spacing: .08em; }
      .line { stroke: #4f8064; stroke-width: 2; fill: none; }
    </style>
  </defs>
  <rect width="1200" height="330" rx="20" fill="#f3f5f0"/>

  <!-- Source -->
  <rect class="box" x="30" y="115" width="170" height="100" rx="14"/>
  <text class="tag" x="50" y="143">SOURCE</text>
  <text class="t" x="50" y="170">YouTube</text>
  <text class="s" x="50" y="192">vidéo · chaîne · playlist</text>

  <!-- yt-dlp + FFmpeg -->
  <rect class="box" x="250" y="115" width="190" height="100" rx="14"/>
  <text class="tag" x="270" y="143">PRÉPARATION</text>
  <text class="t" x="270" y="170">yt-dlp + FFmpeg</text>
  <text class="s" x="270" y="192">audio 16 kHz · 1 image/s</text>

  <!-- Audio branch -->
  <rect class="gpu" x="500" y="30" width="270" height="110" rx="14"/>
  <text class="tag" x="520" y="58">AUDIO · GPU</text>
  <text class="t" x="520" y="85">Qwen3-ASR 1.7B</text>
  <text class="s" x="520" y="107">Silero VAD · langue imposée</text>
  <text class="s" x="520" y="126">ForcedAligner : horodatage par mot</text>

  <!-- Vision branch -->
  <rect class="gpu" x="500" y="190" width="270" height="110" rx="14"/>
  <text class="tag" x="520" y="218">IMAGE · GPU</text>
  <text class="t" x="520" y="245">Qwen3.5-9B (llama.cpp)</text>
  <text class="s" x="520" y="267">séquences de 7 s · JSON contraint</text>
  <text class="s" x="520" y="286">description + texte à l’écran</text>

  <!-- Export -->
  <rect class="box" x="830" y="115" width="160" height="100" rx="14"/>
  <text class="tag" x="850" y="143">FUSION</text>
  <text class="t" x="850" y="170">Export</text>
  <text class="s" x="850" y="192">validation · schéma 2.0</text>

  <!-- Outputs -->
  <g>
    <rect x="1040" y="62" width="130" height="50" rx="10" fill="#23563d"/>
    <text x="1105" y="93" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">Markdown</text>
    <rect x="1040" y="140" width="130" height="50" rx="10" fill="#23563d"/>
    <text x="1105" y="171" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">JSON</text>
    <rect x="1040" y="218" width="130" height="50" rx="10" fill="#23563d"/>
    <text x="1105" y="249" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">JSONL · ZIP</text>
  </g>

  <!-- Links -->
  <path class="line" d="M200 165 H244" marker-end="url(#arrow)"/>
  <path class="line" d="M440 165 C470 165 470 85 494 85" marker-end="url(#arrow)"/>
  <path class="line" d="M440 165 C470 165 470 245 494 245" marker-end="url(#arrow)"/>
  <path class="line" d="M770 85 C800 85 800 165 824 165" marker-end="url(#arrow)"/>
  <path class="line" d="M770 245 C800 245 800 165 824 165" marker-end="url(#arrow)"/>
  <path class="line" stroke-dasharray="5 5" d="M635 140 V184" marker-end="url(#arrow)"/>
  <text class="s" x="645" y="167">transcription du passage</text>
  <path class="line" d="M990 165 C1015 165 1015 87 1034 87" marker-end="url(#arrow)"/>
  <path class="line" d="M990 165 H1034" marker-end="url(#arrow)"/>
  <path class="line" d="M990 165 C1015 165 1015 243 1034 243" marker-end="url(#arrow)"/>
</svg>
